# Coach module configuration. Mirrors the coach rules in the Claude project.
# Thresholds/zones are NOT stored here - they are read live from intervals.icu.

athlete_id: i573787          # overridden by env ATHLETE_ID if set
timezone: Europe/Berlin
goal: "Haspa Marathon Hamburg, 25.04.2027, unter 3:00 h (Marathonpace 4:15/km)"

pace_tolerance: 0.025        # ±2.5 % around the planned pace corridor
decoupling_full: 5           # % -> full points
decoupling_zero: 10          # % -> zero points

ampel:
  green: 85
  yellow: 70

hr_caps:                     # zone whose upper bound is the HR limit
  easy: Z1
  recovery: Z1
  long: Z2

weights:
  easy:      {hr_cap: 50, pace: 20, volume: 20, decoupling: 10}
  recovery:  {hr_cap: 50, pace: 20, volume: 20, decoupling: 10}
  long:      {volume: 40, hr_base: 30, decoupling: 20, finish: 10}
  interval:  {corridor: 50, consistency: 20, completion: 20, recovery: 10}
  threshold: {corridor: 40, hr_drift: 30, volume: 20, consistency: 10}
  mp:        {corridor: 50, decoupling: 20, volume: 20, hr: 10}
  # "test" deliberately has no weights -> no score

hr_filter:
  spike_bpm: 20              # jump between consecutive samples
  margin_bpm: 5              # "near threshold" = LTHR - margin
  min_seconds: 30            # sustained high HR at easy speed
  max_artifact_share: 0.20   # above this, HR criteria are suspended

jobs:
  debrief_lookback_days: 3
  min_moving_minutes: 10
  sport_types: [Run, TrailRun, VirtualRun]

llm:
  provider: gemini           # gemini (kostenlos) | anthropic (kostenpflichtig) | none (nur Regeltexte)
  gemini_models:             # werden der Reihe nach probiert; "-latest" zeigt immer auf das aktuelle Modell
    - gemini-flash-latest
    - gemini-flash-lite-latest
  anthropic_model: claude-haiku-5-5
  max_tokens: 2048

gcal:
  enabled: true              # needs secrets GOOGLE_SA_JSON + GCAL_CALENDAR_ID
  days_back: 7               # sync window
  days_ahead: 14
  default_times:             # start time of planned workouts (unless set in intervals.icu)
    weekday: "16:30"
    weekend: "10:00"
